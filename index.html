<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>9M2PJU Amateur Radio Bearing Finder</title>
    <meta name="title" content="9M2PJU Amateur Radio Bearing Finder">
    <meta name="description" content="9M2PJU Amateur Radio Bearing Finder helps ham radio operators calculate bearings, distances, path loss, signal strength, and Maidenhead grid squares. Perfect for DXing, contesting, and field operations.">
    <meta name="keywords" content="radio amatur, cari bearing, bearing kompas, 9M2PJU, amateur radio, ham radio, bearing finder, radio compass, antenna alignment, ham radio tools, ham radio apps, distance calculator, maidenhead grid, free space loss, path loss, signal strength, QSO probability, HF propagation, VHF UHF direction, APRS, DXing, ham radio Malaysia">
    <meta name="author" content="9M2PJU">
    <meta name="theme-color" content="#10231f">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="9M2PJU Bearing">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="/" aria-label="9M2PJU Amateur Radio Bearing Finder">
                <img src="icons/logo.svg" alt="" width="72" height="72">
                <span>
                    <strong>9M2PJU</strong>
                    <small>Amateur Radio Bearing Finder</small>
                </span>
            </a>
            <div class="header-actions">
                <span class="status-pill" id="networkStatus">Online</span>
                <button id="installApp" class="btn btn-ghost" hidden>
                    <i class="fas fa-download"></i>
                    Install
                </button>
            </div>
        </header>

        <main class="dashboard" aria-label="Bearing finder dashboard">
            <div class="controls-panel">
                <section class="panel-section">
                    <div class="section-heading">
                        <h2><i class="fas fa-location-crosshairs"></i> Station</h2>
                        <button id="getLocation" class="icon-btn" title="Use GPS location" aria-label="Use GPS location">
                            <i class="fas fa-crosshairs"></i>
                        </button>
                    </div>
                    <div class="field-grid">
                        <div class="field">
                            <label for="lat">Latitude</label>
                            <input type="number" id="lat" step="0.000001" placeholder="Latitude">
                        </div>
                        <div class="field">
                            <label for="lon">Longitude</label>
                            <input type="number" id="lon" step="0.000001" placeholder="Longitude">
                        </div>
                    </div>
                </section>

                <section class="panel-section">
                    <div class="section-heading">
                        <h2><i class="fas fa-tower-broadcast"></i> Target</h2>
                    </div>
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Search place or grid area">
                        <button id="searchBtn" class="icon-btn dark" title="Search destination" aria-label="Search destination">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div class="field-grid">
                        <div class="field">
                            <label for="destLat">Dest. latitude</label>
                            <input type="number" id="destLat" step="0.000001" placeholder="Dest. lat">
                        </div>
                        <div class="field">
                            <label for="destLon">Dest. longitude</label>
                            <input type="number" id="destLon" step="0.000001" placeholder="Dest. lon">
                        </div>
                    </div>
                </section>

                <section class="panel-section">
                    <div class="section-heading">
                        <h2><i class="fas fa-sliders"></i> RF setup</h2>
                    </div>
                    <div class="field-grid three">
                        <div class="field">
                            <label for="frequency">Frequency MHz</label>
                            <input type="number" id="frequency" step="0.001" placeholder="146.52">
                        </div>
                        <div class="field">
                            <label for="power">Power W</label>
                            <input type="number" id="power" step="0.1" placeholder="5">
                        </div>
                        <div class="field">
                            <label for="antenna">Antenna m</label>
                            <input type="number" id="antenna" step="0.1" placeholder="2">
                        </div>
                    </div>
                </section>
            </div>

            <div class="results-panel">
                <div class="bearing-display">
                    <div class="compass-rose">
                        <div class="compass-needle" id="compassNeedle">
                            <div class="needle"></div>
                        </div>
                        <div class="pivot"></div>
                        <div class="compass-labels">
                            <span class="north">N</span>
                            <span class="east">E</span>
                            <span class="south">S</span>
                            <span class="west">W</span>
                        </div>
                        <div class="compass-ring"></div>
                    </div>
                    <div class="bearing-info">
                        <div class="bearing-value">
                            <span class="metric-label">Bearing</span>
                            <span id="bearingDegrees">0°</span>
                            <span id="bearingDirection">N</span>
                        </div>
                        <div class="distance metric-card">
                            <span class="metric-label">Distance</span>
                            <strong id="distanceKm">0 km</strong>
                        </div>
                    </div>
                </div>

                <div class="radio-calculations">
                    <h2><i class="fas fa-calculator"></i> Radio calculations</h2>
                    <div class="calc-grid">
                        <div class="calc-item">
                            <span class="label">Path Loss:</span>
                            <span id="pathLoss">0 dB</span>
                        </div>
                        <div class="calc-item">
                            <span class="label">Free Space Loss:</span>
                            <span id="freeSpaceLoss">0 dB</span>
                        </div>
                        <div class="calc-item">
                            <span class="label">Signal Strength:</span>
                            <span id="signalStrength">0 dBm</span>
                        </div>
                        <div class="calc-item">
                            <span class="label">QSO Probability:</span>
                            <span id="qsoProbability">0%</span>
                        </div>
                    </div>
                </div>

                <div class="maidenhead-section">
                    <h2><i class="fas fa-border-all"></i> Maidenhead grid</h2>
                    <div class="grid-info">
                        <div class="grid-item">
                            <span class="label">Your Grid:</span>
                            <span id="yourGrid">--</span>
                        </div>
                        <div class="grid-item">
                            <span class="label">Dest. Grid:</span>
                            <span id="destGrid">--</span>
                        </div>
                        <div class="grid-item">
                            <span class="label">Grid Distance:</span>
                            <span id="gridDistance">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <section class="map-container" aria-label="Map and path preview">
                <div id="map"></div>
                <div class="map-controls">
                    <button id="centerMap" class="icon-btn light" title="Center on station" aria-label="Center on station">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                    <button id="toggleLayers" class="icon-btn light" title="Change map layer" aria-label="Change map layer">
                        <i class="fas fa-layer-group"></i>
                    </button>
                </div>
            </section>
        </main>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
